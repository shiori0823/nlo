<style>
  /* A4 縦（210×297mm）／印刷用・白地×黒文字＋オレンジ */
  @page { size: A4 portrait; margin: 0; }
  :root{
    --orange: #E35C0A;
    --ink:    #000000;
    --sub:    #444444;
    --rule:   #cccccc;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#ffffff; }
  body{
    width:210mm; height:297mm;
    font-family:"Zen Kaku Gothic New", "IPAPGothic", sans-serif;
    color:var(--ink);
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  .sheet{
    width:210mm; height:297mm;
    padding:17mm 16mm 14mm;
    display:flex; flex-direction:column;
  }

  .kicker{
    font-size:10.5pt; letter-spacing:.32em; color:var(--sub);
    line-height:1; margin:0 0 5mm;
  }
  h1{
    font-family:"Shippori Mincho B1", serif;
    font-weight:600;
    font-size:31pt;
    line-height:1.35;
    letter-spacing:.01em;
    margin:0 0 6mm;
  }
  .lead{
    font-family:"Shippori Mincho B1", serif;
    font-size:13pt; line-height:1.85; color:var(--ink);
    margin:0 0 7mm;
  }
  .lead b{ font-weight:600; border-bottom:1.2mm solid #FBD9BE; }

  .date-band{
    border-top:1.1mm solid var(--orange);
    border-bottom:.3mm solid var(--rule);
    padding:4mm 0 5mm;
    margin:0 0 7mm;
    display:flex; align-items:baseline; gap:5mm; flex-wrap:wrap;
  }
  .date{
    font-family:"Oswald", "Zen Kaku Gothic New", sans-serif;
    font-size:30pt; font-weight:500; line-height:1.1;
    color:var(--orange); letter-spacing:.01em;
  }
  .date-note{ font-size:10.5pt; color:var(--sub); line-height:1.6; }

  .menu{ display:flex; gap:5mm; margin:0 0 6mm; }
  .menu > div{
    flex:1;
    border:.3mm solid var(--rule);
    padding:4.5mm 5mm;
  }
  .menu dt{
    font-size:10pt; color:var(--sub); letter-spacing:.06em;
    line-height:1.5; margin:0 0 1.5mm;
  }
  .menu dd{
    margin:0; font-size:14pt; font-weight:500; line-height:1.4;
  }
  .menu dd .m{ font-family:"Oswald","Zen Kaku Gothic New",sans-serif; font-size:16pt; }

  .badge{
    display:inline-block;
    align-self:flex-start;
    background:var(--orange); color:#ffffff;
    font-size:12pt; font-weight:700; letter-spacing:.12em;
    padding:2.4mm 6mm; line-height:1.4;
    margin:0 0 6mm;
  }

  .closing{
    font-family:"Shippori Mincho B1", serif;
    font-size:14pt; line-height:1.95; margin:0;
  }
  .closing em{ font-style:normal; color:var(--orange); font-weight:600; }

  .spacer{ flex:1; min-height:3mm; }

  .apply{
    border:.5mm solid var(--ink);
    padding:6mm 6mm 5.5mm;
    display:flex; gap:6mm; align-items:center;
  }
  .apply .qr{ flex:none; width:44mm; height:44mm; display:block; }
  .apply .txt{ flex:1; }
  .apply h2{
    font-size:14pt; font-weight:700; line-height:1.5;
    margin:0 0 2.5mm; letter-spacing:.02em;
  }
  .apply h2 span{ color:var(--orange); }
  .apply p{ font-size:10.5pt; line-height:1.75; color:var(--sub); margin:0 0 2.5mm; }
  .apply .url{
    font-family:"Oswald","Zen Kaku Gothic New",sans-serif;
    font-size:10pt; letter-spacing:.02em; color:var(--ink);
    border-top:.3mm solid var(--rule); padding-top:2.5mm; margin:0;
    word-break:break-all;
  }

  .foot{
    margin:4mm 0 0;
    font-size:9pt; color:var(--sub); line-height:1.6;
    display:flex; justify-content:space-between; gap:4mm;
  }
</style>
</head>
